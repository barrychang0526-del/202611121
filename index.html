<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>p5.js 格鬥精靈動畫｜20261112</title>
<link rel="stylesheet" href="style.css">
<script src="libraries/p5.min.js"></script>
<script defer src="sketch.js"></script>
</head>
<body>
<div id="hud"><b>🥋 格鬥精靈動畫</b><div>A / D 或 ← →：移動｜W / ↑ / 空白：跳躍<br>J：踢腿發功｜S / ↓：蹲下｜K：防禦</div><div id="status">正在載入遊戲…</div></div>
<div class="touch"><div class="touch-group"><button data-hold="a">◀</button><button data-hold="d">▶</button><button data-hold="s">蹲</button></div><div class="touch-group"><button data-hold="k">防</button><button data-tap="jump">跳</button><button data-tap="kick">踢</button></div></div>
<script>
for(const btn of document.querySelectorAll('[data-hold]')) {const key=btn.dataset.hold;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);window.setGameKey?.(key,true)});const release=e=>{e.preventDefault();window.setGameKey?.(key,false)};btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release)}
for(const btn of document.querySelectorAll('[data-tap]')) btn.addEventListener('pointerdown',e=>{e.preventDefault();if(btn.dataset.tap==='jump')window.gameJump?.();else window.gameKick?.()});
</script>
</body>
</html>
